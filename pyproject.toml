[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cognitiveos"
version = "0.1.0"
description = "Local-first Cognitive Runtime Layer for AI Agents"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "CognitiveOS Contributors" }]
dependencies = [
    "rich>=13",
    "jinja2>=3",
]

[project.scripts]
cogos = "cogos.cli:main"

[tool.setuptools.packages.find]
where = ["src"]