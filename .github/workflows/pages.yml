name: Deploy demo site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build demo site (fake data only)
        run: |
          pip install jinja2
          python scripts/build_demo_site.py

      - name: Verify no real-data leaks into published artifact
        env:
          COGOS_PRIVACY_PATTERNS: ${{ secrets.COGOS_PRIVACY_PATTERNS }}
        run: |
          # Defensive check: the public demo must never contain real-user
          # data. Patterns live in the repo Secret COGOS_PRIVACY_PATTERNS
          # (one regex per line) so the real terms never appear in this
          # repository. If this fails, somebody wired real data into the demo.
          if [ -z "$COGOS_PRIVACY_PATTERNS" ]; then
            echo "WARNING: COGOS_PRIVACY_PATTERNS secret is empty; skipping substantive scan." >&2
          else
            printf '%s\n' "$COGOS_PRIVACY_PATTERNS" > /tmp/privacy_patterns.txt
            if grep -qi -f /tmp/privacy_patterns.txt demo/index.html; then
              echo "ERROR: demo/index.html contains private content. Aborting." >&2
              exit 1
            fi
          fi
          echo "privacy check passed: demo contains only fake data"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo

      - uses: actions/deploy-pages@v4
